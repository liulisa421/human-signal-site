<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>痛點・心情・閒聊站｜人們正在經歷什麼</title>
<style>
:root{--paper:rgba(255,255,255,.86);--ink:#25272a;--muted:#776f65;--line:#ded3c5}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:linear-gradient(135deg,#faf6ef,#eee0cc 48%,#f8f3eb);min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:24px 20px 58px}.hero{text-align:center}.hero h1{font-size:38px;margin:0 0 7px}.hero p{margin:0;color:var(--muted)}.toolbar{margin:18px auto 12px;max-width:940px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:12px}.search{display:flex;gap:9px;background:#fff;border:1px solid #ddd3c7;border-radius:14px;padding:10px 13px}.search input{border:0;outline:0;width:100%;font-size:15px}.signal-tabs,.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}.tab,.f{border:1px solid var(--line);background:#fffaf4;border-radius:999px;padding:9px 14px;font-size:14px}.tab.active{background:#fff}.f{border-radius:11px;padding:7px 9px}.f select{border:0;background:transparent}.clear{border:0;background:transparent;color:#8a7e70}.qa{text-align:center;color:var(--muted);font-size:12px;margin-top:9px}.content{margin-top:16px}.headline h2{font-size:24px;margin:0}.headline p{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:16px}.type{font-size:12px;color:#8b7c6c}.card h3{font-size:16px;margin:7px 0 6px;line-height:1.4}.cluster{font-size:13px;line-height:1.6;color:#5f5952;margin:0}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.tag{background:#f0ebe4;border-radius:999px;padding:5px 8px;font-size:11px;color:#71675d}.src{display:inline-block;margin-top:10px;color:#51473c;font-size:12px;text-decoration:none}.reco{margin-top:22px;background:rgba(255,255,255,.62);border:1px solid var(--line);border-radius:20px;padding:17px}.reco-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rec{background:#fff;border:1px solid #e6ddd2;border-radius:15px;padding:14px}.rec h3{margin:0 0 5px}.rec p,.method{color:var(--muted);font-size:13px}.method{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.wrap{padding:18px 12px 45px}.grid,.reco-grid{grid-template-columns:1fr}.hero h1{font-size:28px}.signal-tabs{display:grid}.tab{width:100%}.filters{justify-content:flex-start}}
</style>
</head>
<body><main class="wrap">
<header class="hero"><h1>痛點・心情・閒聊站</h1><p>不同地方的人們，正在經歷什麼？</p></header>
<section class="toolbar">
<div class="search">🔎 <input id="q" placeholder="搜尋：工作、退休、育兒、房市、心情…"></div>
<div class="signal-tabs"><button class="tab active" data-type="pain">🔥 最近在煩什麼</button><button class="tab" data-type="emotion">💭 最近是什麼心情</button><button class="tab" data-type="topic">☕ 最近都在聊什麼</button></div>
<div class="filters"><label class="f">來源地區 <select id="region"><option>亞洲</option><option>全世界</option><option>歐洲</option><option>北美</option><option>拉丁美洲與加勒比</option><option>非洲</option><option>大洋洲</option><option>中東／西亞／中亞</option></select></label><label class="f">來源市場 <select id="country"></select></label><label class="f">時間 <select id="period"><option>近期</option><option>1 年</option><option>5 年</option><option>全部</option></select></label><button class="clear">清除</button></div>
<div id="summary" class="qa"></div></section>
<section class="content"><div class="headline"><h2 id="headline">🔥 最近在煩什麼？</h2><p id="sub">看看人們最近正在面對哪些困擾與需求。</p></div><div id="grid" class="grid"></div></section>
<section class="reco"><h2>🌱 Gaia 好網推薦</h2><div class="reco-grid"><article class="rec"><h3>🎵 Gaia Music</h3><p>累了的時候，讓音樂陪你慢下來。</p><a href="https://www.youtube.com/@GaiaMusicTW" target="_blank" rel="noopener">去聽音樂 →</a></article><article class="rec"><h3>📈 Gaia 台股研究室</h3><p>網站與教學內容正在建構。</p></article></div></section>
<details class="method"><summary>這些資料怎麼來的？</summary><p>本站內容來自公開網路分享。年齡只採作者明確自述，來源情境不代表作者國籍或所在地；這些欄位保留在後台，不直接當成前台人物標籤。</p></details>
</main>
<script>
let RAW=[],current='pain';const $=id=>document.getElementById(id);const grid=$('grid'),q=$('q'),region=$('region'),country=$('country'),period=$('period'),summary=$('summary'),headline=$('headline'),sub=$('sub');
const REGIONS={'全世界':['全部'],'亞洲':['全部','台灣','日本','香港','中國大陸','韓國','新加坡','泰國','越南','馬來西亞','印尼','菲律賓','印度'],'歐洲':['全部','德國','法國','英國','義大利','西班牙','荷蘭','瑞典'],'北美':['全部','美國','加拿大','墨西哥'],'拉丁美洲與加勒比':['全部','巴西','阿根廷','智利','哥倫比亞'],'非洲':['全部','南非','奈及利亞','肯亞','埃及'],'大洋洲':['全部','澳洲','紐西蘭'],'中東／西亞／中亞':['全部','土耳其','以色列','阿拉伯聯合大公國','沙烏地阿拉伯','哈薩克']};
const CR={台灣:'亞洲',日本:'亞洲',香港:'亞洲','中國大陸':'亞洲',韓國:'亞洲',新加坡:'亞洲',泰國:'亞洲',越南:'亞洲',馬來西亞:'亞洲',印尼:'亞洲',菲律賓:'亞洲',印度:'亞洲',德國:'歐洲',法國:'歐洲',英國:'歐洲',義大利:'歐洲',西班牙:'歐洲',荷蘭:'歐洲',瑞典:'歐洲',美國:'北美',加拿大:'北美',墨西哥:'北美',巴西:'拉丁美洲與加勒比',阿根廷:'拉丁美洲與加勒比',智利:'拉丁美洲與加勒比',哥倫比亞:'拉丁美洲與加勒比',南非:'非洲',奈及利亞:'非洲',肯亞:'非洲',埃及:'非洲',澳洲:'大洋洲',紐西蘭:'大洋洲',土耳其:'中東／西亞／中亞',以色列:'中東／西亞／中亞','阿拉伯聯合大公國':'中東／西亞／中亞','沙烏地阿拉伯':'中東／西亞／中亞',哈薩克:'中東／西亞／中亞'};
const ALIAS={TW:'台灣',TAIWAN:'台灣',JP:'日本',JAPAN:'日本',HK:'香港','HONG KONG':'香港',CN:'中國大陸',CHINA:'中國大陸',KR:'韓國',KOREA:'韓國',SG:'新加坡',US:'美國',USA:'美國','UNITED STATES':'美國',CA:'加拿大',CANADA:'加拿大'};
const TOPIC={'Dating & Relationships':'感情／關係','Friendship & Social Hurt':'朋友／人際','Work & Career':'工作／職涯','Family & Parenting':'家庭／育兒','Money & Financial Stress':'金錢／財務','Housing & Living':'居住／生活','Health & Wellbeing':'健康／身心','Education & Learning':'學習／教育','Loneliness & Belonging':'孤獨／歸屬','Self Growth & Identity':'自我／成長'};
function marketOf(x){const v=String(x.market||x.source_country_context||'').trim();if(!v||['UNKNOWN','GLOBAL'].includes(v.toUpperCase()))return '全部';return ALIAS[v.toUpperCase()]||v}function regionOf(m){return CR[m]||'全世界'}
function safeURL(v){try{const u=new URL(v,location.href);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}}
function inPeriod(d,v){if(v==='全部')return true;const t=new Date(d).getTime();if(!Number.isFinite(t))return v==='近期';const days=v==='近期'?30:v==='1 年'?365:1825;return Date.now()-t<=days*86400000}
function collapse(items){const seen=new Set(),out=[];for(const x of items){const title=String(x.title||'');const key=(String(x.source_id||'')+'|'+title.replace(/^\s*\[[^\]]+\]\s*/,'').replace(/\s*[-–—－]\s*\d{1,2}(?:\s+.*)?$/,'').trim().toLowerCase());if(seen.has(key))continue;seen.add(key);out.push(x)}return out}
function updateCountries(){country.innerHTML=(REGIONS[region.value]||['全部']).map(v=>`<option>${v}</option>`).join('')}
function typeMatch(x){if(current==='pain')return !!x.pain_need;if(current==='emotion')return !!x.author_emotion&&String(x.author_emotion).toUpperCase()!=='UNKNOWN';return true}
function render(){headline.textContent=current==='pain'?'🔥 最近在煩什麼？':current==='emotion'?'💭 最近是什麼心情？':'☕ 最近都在聊什麼？';sub.textContent=current==='pain'?'看看人們最近正在面對哪些困擾與需求。':current==='emotion'?'看看公開分享中明確表達的心情。':'看看最近公開分享裡出現的生活話題。';const term=q.value.trim().toLowerCase();const list=collapse(RAW).filter(x=>{const m=marketOf(x),r=regionOf(m),blob=[x.title,x.human_voice,x.primary_human_topic,x.author_emotion].join(' ').toLowerCase();return typeMatch(x)&&(!term||blob.includes(term))&&(region.value==='全世界'||r===region.value)&&(country.value==='全部'||m===country.value)&&inPeriod(x.created_at_source,period.value)});summary.textContent=`找到 ${list.length} 筆相關分享`;grid.replaceChildren();if(!list.length){const e=document.createElement('div');e.className='card';e.textContent='目前沒有符合這組條件的公開分享。可以調整時間或清除篩選。';grid.append(e);return}for(const x of list){const a=document.createElement('article');a.className='card';const type=document.createElement('div');type.className='type';type.textContent=current==='pain'?'🔥 困擾／需求':current==='emotion'?'💭 心情':'☕ 話題';const h=document.createElement('h3');h.textContent=x.title||x.human_voice||'未命名分享';const p=document.createElement('p');p.className='cluster';const s=String(x.human_voice||'').replace(/\s+/g,' ').trim();p.textContent=s.length>110?s.slice(0,110)+'…':s;a.append(type,h,p);const topic=TOPIC[x.primary_human_topic]||(/[\u4e00-\u9fff]/.test(String(x.primary_human_topic||''))?x.primary_human_topic:'');if(topic){const tags=document.createElement('div');tags.className='tags';const t=document.createElement('span');t.className='tag';t.textContent=topic;tags.append(t);a.append(tags)}const u=safeURL(x.source_url);if(u){const link=document.createElement('a');link.className='src';link.href=u;link.target='_blank';link.rel='noopener noreferrer';link.textContent='查看公開來源 →';a.append(link)}grid.append(a)}}
async function load(){try{const r=await fetch('./public_data.json',{cache:'no-store'});const j=await r.json();RAW=Array.isArray(j.items)?j.items:[]}catch{RAW=[]}updateCountries();render()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.type;render()});q.oninput=render;region.onchange=()=>{updateCountries();render()};country.onchange=render;period.onchange=render;document.querySelector('.clear').onclick=()=>{q.value='';region.value='亞洲';updateCountries();period.value='近期';render()};load();
</script></body></html>
