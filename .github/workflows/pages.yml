name: Human Signal Public Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Pages readback
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "${PAGE_URL:-}"
          echo "Verifying ${PAGE_URL}"
          for i in 1 2 3 4 5 6; do
            code=$(curl -L -sS -o /tmp/human-signal-live.html -w '%{http_code}' "${PAGE_URL}" || true)
            if [ "$code" = "200" ] && grep -q '此刻，人們正在經歷什麼？' /tmp/human-signal-live.html; then
              grep -q 'noindex,nofollow' /tmp/human-signal-live.html
              echo "LIVE_READBACK_PASS url=${PAGE_URL} http=200 marker=PASS noindex=PASS"
              exit 0
            fi
            echo "Live readback not ready yet: attempt=${i} http=${code}"
            sleep 10
          done
          echo "LIVE_READBACK_FAIL url=${PAGE_URL}" >&2
          exit 1
      - name: Record completion contract
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          cat > /tmp/completion_status.json <<JSON
          {
            "contract": "human-signal-pages-v1",
            "status": "COMPLETE",
            "site_commit": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "pages_deploy": "PASS",
            "live_http_readback": "PASS",
            "content_marker": "PASS",
            "noindex_guard": "PASS",
            "page_url": "${PAGE_URL}"
          }
          JSON
          cat /tmp/completion_status.json
          {
            echo '### Human Signal completion contract'
            echo '- Status: **COMPLETE**'
            echo "- Site commit: \`${GITHUB_SHA}\`"
            echo '- Pages deploy: PASS'
            echo '- Live HTTP readback: PASS'
            echo '- Content marker: PASS'
            echo '- noindex guard: PASS'
            echo "- URL: ${PAGE_URL}"
          } >> "$GITHUB_STEP_SUMMARY"